egled pomaže ti procijeniti kod prije otvaranja, ali nijedan softver ne može jamčiti da je odredište sigurno. Otvaraj samo ono čemu vjeruješ.","Kodovi i povijest žive na tvom uređaju. Čuvaj vlastite sigurnosne kopije; ne možemo vratiti podatke s uređaja koji nikada ne vidimo."],"pages":{"terms":{"title":"QR Code Halo uvjeti korištenja","meta":"Jednostavni uvjeti korištenja aplikacije QR Code Halo, sigurnog QR skenera i kreatora.","badge":"Uvjeti","h1":"Jednostavni uvjeti.","lead":"Što možeš očekivati od aplikacije i što mi molimo od tebe."}}},"cs":{"langName":"Čeština","langLabel":"Jazyk","navHome":"Úvod","navSupport":"Podpora","navPrivacy":"Soukromí","navTerms":"Podmínky","foot":"QR Code Halo běží výhradně ve vašem zařízení. Bez účtu, bez reklam, bez analytiky, bez nahrávání.","updated":"Poslední aktualizace","secContact":"Kontakt","contact":"Napište nám v jakémkoli jazyce. Každou zprávu čte skutečný člověk.","contactHint":"Hodně pomůže, když uvedete typ kódu, verzi iOS a co jste viděli na obrazovce. Pevnou dobu odpovědi neslibujeme.","secTerms":"Podmínky použití","terms":["QR Code Halo je poskytována tak, jak je, pro osobní i pracovní použití na vašich vlastních zařízeních Apple.","Aplikace je ke stažení z App Storu zdarma, s volitelným jednorázovým nákupem Lifetime Pro, který odemkne neomezenou historii, oblíbené, vyhledávání, vlastní styly, export ve vysokém rozlišení a zálohu. Žádné předplatné neexistuje.","Nákupy, obnovy a vrácení peněz vyřizuje Apple podle podmínek App Storu. Žádosti o vrácení peněz směřují na Apple, nikoli na nás.","Za kódy, které skenujete, vytváříte a sdílíte, i za obsah, který do nich vkládáte, odpovídáte vy. Nepoužívejte aplikaci k šíření obsahu, k němuž nemáte práva, ani ke klamání lidí, kteří vaše kódy naskenují.","Bezpečný náhled vám pomůže kód posoudit před otevřením, žádný software ale nemůže zaručit, že je cíl bezpečný. Otevírejte jen to, čemu důvěřujete.","Kódy i historie žijí ve vašem zařízení. Zálohujte si je sami; data ze zařízení, které nikdy nevidíme, obnovit nedokážeme."],"pages":{"terms":{"title":"Podmínky použití QR Code Halo","meta":"Srozumitelné podmínky používání QR Code Halo, bezpečné čtečky a tvorby QR.","badge":"Podmínky","h1":"Srozumitelné podmínky.","lead":"Co můžete čekat od aplikace a co žádáme od vás."}}},"da":{"langName":"Dansk","langLabel":"Sprog","navHome":"Forside","navSupport":"Support","navPrivacy":"Privatliv","navTerms":"Vilkår","foot":"QR Code Halo kører udelukkende på din enhed. Ingen konto, ingen reklamer, ingen analyse, ingen upload.","updated":"Senest opdateret","secContact":"Kontakt","contact":"Skriv til os på et hvilket som helst sprog. Et rigtigt menneske læser hver besked.","contactHint":"Det hjælper meget, hvis du nævner kodetypen, din iOS-version og det, du så på skærmen. Vi lover ikke en fast svartid.","secTerms":"Vilkår for brug","terms":["QR Code Halo leveres, som den er, til personlig og professionel brug på dine egne Apple-enheder.","Appen er en gratis download i App Store med et valgfrit Lifetime Pro-engangskøb, der låser op for ubegrænset historik, favoritter, søgning, egne stilarter, eksport i høj opløsning og backup. Der er intet abonnement.","Køb, gendannelser og refusioner håndteres af Apple efter App Stores vilkår. Anmodninger om refusion går til Apple, ikke til os.","Du er ansvarlig for de koder, du scanner, opretter og deler, og for det indhold, du koder ind. Brug ikke appen til at sprede indhold, du ikke har ret til, eller til at vildlede dem, der scanner dine koder.","Den sikre forhåndsvisning hjælper dig med at vurdere en kode, før du åbner den, men ingen software kan garantere, at et mål er sikkert. Åbn kun det, du stoler på.","Koder og historik ligger på din enhed. Sørg for dine egne backups; vi kan ikke gendanne data fra en enhed, vi aldrig ser."],"pages":{"terms":{"title":"QR Code Halo vilkår for brug","meta":"Klare vilkår for brug af QR Code Halo, den sikre QR-scanner og QR-generator.","badge":"Vilkår","h1":"Klare vilkår.","lead":"Hv <script>
(function(){
 var D=window.QH_I18N,L=Object.keys(D),PAGE=document.body.dataset.page;
 var RTL={"ar-SA":1,"he":1,"ur-PK":1};
 function resolve(t){
  if(!t)return"en-US";
  if(D[t])return t;
  var base=t.split("-")[0].toLowerCase();
  var map={en:"en-US",zh:"zh-Hans",pt:"pt-PT",fr:"fr-FR",es:"es-ES",de:"de-DE",nl:"nl-NL",ar:"ar-SA",
           sl:"sl-SI",bn:"bn-BD",gu:"gu-IN",kn:"kn-IN",ml:"ml-IN",mr:"mr-IN",or:"or-IN",pa:"pa-IN",
           ta:"ta-IN",te:"te-IN",ur:"ur-PK",nb:"no",nn:"no",he:"he",iw:"he",in:"id",ji:"he"};
  if(t.toLowerCase().indexOf("zh")===0)
   return /hant|tw|hk|mo/i.test(t)?"zh-Hant":"zh-Hans";
  if(t.toLowerCase().indexOf("pt")===0)return /br/i.test(t)?"pt-BR":"pt-PT";
  if(t.toLowerCase().indexOf("en")===0)
   return /gb|uk|ie/i.test(t)?"en-GB":/au|nz/i.test(t)?"en-AU":/ca/i.test(t)?"en-CA":"en-US";
  if(t.toLowerCase().indexOf("fr")===0)return /ca/i.test(t)?"fr-CA":"fr-FR";
  if(t.toLowerCase().indexOf("es")===0)return /mx|us|ar|cl|co|pe/i.test(t)?"es-MX":"es-ES";
  if(map[base]&&D[map[base]])return map[base];
  if(D[base])return base;
  return "en-US";
 }
 function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
 function pick(){
  var q=new URLSearchParams(location.search).get("lang");
  if(q)return resolve(q);
  try{var s=localStorage.getItem("qh-lang");if(s&&D[s])return s}catch(e){}
  var list=navigator.languages||[navigator.language||"en-US"];
  for(var i=0;i<list.length;i++){var r=resolve(list[i]);if(r)return r}
  return "en-US";
 }
 var sel=document.getElementById("lang");
 L.sort(function(a,b){return D[a].langName.localeCompare(D[b].langName)});
 L.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=D[c].langName;sel.appendChild(o)});
 function render(code){
  var d=D[code],rtl=!!RTL[code];
  document.documentElement.lang=code;
  document.documentElement.dir=rtl?"rtl":"ltr";
  sel.value=code;
  document.getElementById("langLabel").textContent=d.langLabel;
  document.title=d.pages[PAGE].title;
  var m=document.querySelector('meta[name=description]');if(m)m.setAttribute("content",d.pages[PAGE].meta);
  var nav=document.getElementById("nav");nav.innerHTML="";
  [["index.html",d.navHome],["support.html",d.navSupport],["privacy.html",d.navPrivacy],["terms.html",d.navTerms]]
   .forEach(function(p){
    var a=document.createElement("a");a.href=p[0]+(code!=="en-US"?"?lang="+code:"");a.textContent=p[1];
    if(p[0].indexOf(PAGE)===0)a.setAttribute("aria-current","page");nav.appendChild(a)});
  document.getElementById("badge").textContent=d.pages[PAGE].badge;
  document.getElementById("h1").textContent=d.pages[PAGE].h1;
  document.getElementById("lead").textContent=d.pages[PAGE].lead;
  document.getElementById("body").innerHTML=BUILD[PAGE](d,code);
  document.getElementById("foot").innerHTML=esc(d.foot)+"<br>"+esc(d.updated)+" 2026-08-30 &middot; &copy; 2026 QR Code Halo";
  try{localStorage.setItem("qh-lang",code)}catch(e){}
 }
 function card(title,inner){return '<section class="card"><h2>'+esc(title)+'</h2>'+inner+'</section>'}
 function tiles(items){return '<div class="grid">'+items.map(function(t){
   var i=t.indexOf("|");return '<div class="tile"><b>'+esc(t.slice(0,i))+'</b>'+esc(t.slice(i+1))+'</div>'}).join("")+'</div>'}
 function list(items){return '<ul class="plain">'+items.map(function(t){return '<li>'+esc(t)+'</li>'}).join("")+'</ul>'}
 function paras(items){return items.map(function(t){return '<p>'+esc(t)+'</p>'}).join("")}
 function qa(items){return items.map(function(p){
   return '<div class="qa"><h3>'+esc(p[0])+'</h3><p>'+esc(p[1])+'</p></div>'}).join("")}
 function mail(d){return card(d.secContact,'<p>'+esc(d.contact)+'</p><p><a class="mail" href="mailto:hourstag.app@gmail.com">hourstag.app@gmail.com</a></p><p>'+esc(d.contactHint)+'</p>')}
 var BUILD={
  "index":function(d){return card(d.secFeatures,tiles(d.tiles))
    +card(d.secFormats,'<p>'+esc(d.formatsLead)+'</p>'+list(d.fea))
    +card(d.secPrivacy,paras(d.privacyShort)+'<p><a class="cta" href="privacy.html">'+esc(d.navPrivacy)+'</a></p>')
  +card(d.secIncluded,paras(d.includedShort))
    +mail(d)},
  "support":function(d){return card(d.secStart,list(d.start))
    +card(d.secFaq,qa(d.faq))
    +card(d.secTrouble,qa(d.trouble))
    +mail(d)},
  "privacy":function(d){return card(d.secPrivacy,paras(d.priv))
    +card(d.secAppStore,paras(d.appStorePurchase))
    +mail(d)},
  "terms":function(d){return card(d.secTerms,paras(d.terms))+mail(d)}
 };
 sel.addEventListener("change",function(){
  var c=sel.value,u=new URL(location.href);u.searchParams.set("lang",c);
  history.replaceState(null,"",u);render(c)});
 render(pick());
})();
</script>
